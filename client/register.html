<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Online Library</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><main class="container py-5" style="max-width:620px"><h1 class="mb-4">Create your library account</h1><form id="registerForm" class="card card-body shadow-sm"><label class="form-label">Full name</label><input name="name" class="form-control mb-3" required><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" required><label class="form-label">Student ID</label><input name="studentId" class="form-control mb-3" required><label class="form-label">Phone</label><input name="phone" class="form-control mb-3" required><label class="form-label">Password</label><input name="password" type="password" minlength="6" class="form-control mb-3" required><label class="form-label">Confirm password</label><input name="confirmPassword" type="password" minlength="6" class="form-control mb-3" required><button class="btn btn-primary">Register</button><p class="mt-3 mb-0">Already registered? <a href="/login.html">Login</a></p></form></main><div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div><script src="/js/main.js"></script><script src="/js/auth.js"></script></body></html>
