<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/admin/dashboard.html"><i class="fa-solid fa-book-open"></i> Library Admin</a><div class="d-flex align-items-center gap-3 text-white"><span data-user-name></span><button class="btn btn-outline-light btn-sm" data-logout>Logout</button></div></div></nav><div class="container-fluid"><div class="row"><aside class="col-lg-2 sidebar p-2"><div class="nav-links"><a href="/admin/dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a><a href="/admin/books.html"><i class="fa-solid fa-book me-2"></i>Books</a><a href="/admin/add-book.html"><i class="fa-solid fa-plus me-2"></i>Add Book</a><a href="/admin/users.html"><i class="fa-solid fa-users me-2"></i>Users</a><a href="/admin/requests.html"><i class="fa-solid fa-clock me-2"></i>Requests</a><a href="/admin/fines.html"><i class="fa-solid fa-money-bill me-2"></i>Fines</a><a href="/"><i class="fa-solid fa-house me-2"></i>Website</a></div></aside><main class="col-lg-10 admin-content"><h1 class="fw-bold">Dashboard</h1><p class="text-muted">Library overview and statistics.</p><div class="row g-3 mt-2"><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><div class="icon"><i class="fa-solid fa-book"></i></div><h3 id="totalBooks" class="mt-3">0</h3><p class="text-muted mb-0">Total Books</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><div class="icon"><i class="fa-solid fa-layer-group"></i></div><h3 id="availableBooks" class="mt-3">0</h3><p class="text-muted mb-0">Available Books</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><div class="icon"><i class="fa-solid fa-book-reader"></i></div><h3 id="issuedBooks" class="mt-3">0</h3><p class="text-muted mb-0">Issued Books</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><div class="icon"><i class="fa-solid fa-users"></i></div><h3 id="totalUsers" class="mt-3">0</h3><p class="text-muted mb-0">Students</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><h3 id="pendingRequests">0</h3><p class="text-muted">Pending Requests</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><h3 id="overdueBooks">0</h3><p class="text-muted">Overdue Books</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><h3 id="totalFines">₹0</h3><p class="text-muted">Total Fines</p></div></div><div class="col-md-6 col-xl-3"><div class="dashboard-stat"><h3 id="categories">0</h3><p class="text-muted">Categories</p></div></div></div><div class="row g-4 mt-2"><div class="col-lg-4"><div class="chart-card"><h5>Books by Category</h5><canvas id="categoryChart"></canvas></div></div><div class="col-lg-4"><div class="chart-card"><h5>Monthly Issues</h5><canvas id="monthlyChart"></canvas></div></div><div class="col-lg-4"><div class="chart-card"><h5>Issue Status</h5><canvas id="statusChart"></canvas></div></div></div></main></div></div>
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="/js/admin/dashboard.js"></script>
</body>
</html>
