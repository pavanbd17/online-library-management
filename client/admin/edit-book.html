<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/admin/dashboard.html"><i class="fa-solid fa-book-open"></i> Library Admin</a><div class="d-flex align-items-center gap-3 text-white"><span data-user-name></span><button class="btn btn-outline-light btn-sm" data-logout>Logout</button></div></div></nav><div class="container-fluid"><div class="row"><aside class="col-lg-2 sidebar p-2"><div class="nav-links"><a href="/admin/dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a><a href="/admin/books.html"><i class="fa-solid fa-book me-2"></i>Books</a><a href="/admin/add-book.html"><i class="fa-solid fa-plus me-2"></i>Add Book</a><a href="/admin/users.html"><i class="fa-solid fa-users me-2"></i>Users</a><a href="/admin/requests.html"><i class="fa-solid fa-clock me-2"></i>Requests</a><a href="/admin/fines.html"><i class="fa-solid fa-money-bill me-2"></i>Fines</a><a href="/"><i class="fa-solid fa-house me-2"></i>Website</a></div></aside><main class="col-lg-10 admin-content"><div><h1 class="fw-bold" id="pageTitle">Edit Book</h1><p class="text-muted">Enter book information.</p><div class="card p-4"><form id="bookForm"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Title</label><input id="title" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Author</label><input id="author" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">ISBN</label><input id="isbn" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Category</label><select id="category" class="form-select" required></select></div><div class="col-12 mb-3"><label class="form-label">Description</label><textarea id="description" class="form-control" rows="4"></textarea></div><div class="col-md-6 mb-3"><label class="form-label">Publisher</label><input id="publisher" class="form-control"></div><div class="col-md-3 mb-3"><label class="form-label">Publication Year</label><input id="publicationYear" type="number" class="form-control" min="1000"></div><div class="col-md-3 mb-3"><label class="form-label">Total Copies</label><input id="totalCopies" type="number" class="form-control" min="1" required></div><div class="col-md-6 mb-3"><label class="form-label">Language</label><input id="language" class="form-control" value="English"></div><div class="col-md-6 mb-3"><label class="form-label">Shelf Location</label><input id="shelfLocation" class="form-control"></div><div class="col-12 mb-3"><label class="form-label">Cover Image URL</label><input id="coverImage" class="form-control" placeholder="https://..."></div></div><button class="btn btn-primary">Save Book</button> <a href="/admin/books.html" class="btn btn-outline-secondary">Cancel</a></form></div></div></main></div></div>
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin/books-form.js"></script>
</body>
</html>
